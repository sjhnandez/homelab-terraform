# Docker Compose integration example
# 
# To use the tunnel token from Terraform:
#
# 1. Export the token:
#    export CLOUDFLARED_TOKEN=$(cd terraform && terraform output -json tunnel_tokens | jq '.TUNNEL_KEY.token' -r)
#
# 2. Run docker-compose with the token:
#    docker-compose up -d
#
# Or add this service to your existing docker-compose.yaml:

version: '3.8'

services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel run --token ${CLOUDFLARED_TOKEN}
    restart: always
    networks:
      - default
    # Optional: Add logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # Optional: Add health check
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "info", "--token", "${CLOUDFLARED_TOKEN}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
